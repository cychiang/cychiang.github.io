# pnpm settings for this repository.

# The site is the root package. The two local Slidev packages are workspace
# members so decks can refer to them by name (`theme: terminal`, addon `site`).
packages:
  - design/slidev-theme
  - slidev-addon-site

overrides:
  # @astrojs/check resolved a beta @emnapi/runtime 2.0.0-beta.2 as a peer, which
  # crashes `astro check` on exit and makes it skip type-checking silently (the
  # command still exits 0 in CI). Keep these on the stable 1.x line, then
  # confirm `pnpm check` prints "Result (N files)" before removing them.
  "@emnapi/runtime": 1.11.3
  "@emnapi/core": 1.11.3

# Dependencies allowed to run install scripts. pnpm blocks all others.
allowBuilds:
  esbuild: true
